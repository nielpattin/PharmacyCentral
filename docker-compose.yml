name: pharmacy-central

x-backend-defaults: &backend-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    valkey:
      condition: service_healthy
    otel-collector:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD-SHELL",
        'node -e "fetch(''http://127.0.0.1:'' + process.env.PORT + ''/health/ready'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
      ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s

x-backend-environment: &backend-environment
  NODE_ENV: development
  DATABASE_USER: ${POSTGRES_USER}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  VALKEY_URL: redis://valkey:6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  INTERNAL_IDENTITY_SECRET: ${INTERNAL_IDENTITY_SECRET}
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}

services:
  postgres:
    image: postgis/postgis:18-3.6@sha256:db8c151a4e1f4686b1a985a3490cf96f9f8c8c2725f58a46ef7a57e52f167cc3
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity_service
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - pharmacy-central-postgres-data:/var/lib/postgresql
      - ./deploy/local/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"

  rabbitmq:
    image: rabbitmq:4.3.5-management@sha256:397fde82bc04522d88680b57cbf5d70caae715a76c957404e52e3f0fa056b8f3
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"

  valkey:
    image: valkey/valkey:9.1.1@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - pharmacy-central-valkey-data:/data
    ports:
      - "${VALKEY_PORT}:6379"

  mailpit:
    image: axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_HTTP_PORT}:8025"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/collector.yaml"]
    volumes:
      - ./deploy/local/otel/collector.yaml:/etc/otelcol-contrib/collector.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/collector.yaml"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "4317:4317"
      - "4318:4318"

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      SEAWEEDFS_MEDIA_BUCKET: ${SEAWEEDFS_MEDIA_BUCKET}
    # Writes need the key pair; anonymous visitors may only read the media bucket (public product images).
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"media-admin","credentials":[{"accessKey":"$$SEAWEEDFS_ACCESS_KEY","secretKey":"$$SEAWEEDFS_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"anonymous","actions":["Read:$$SEAWEEDFS_MEDIA_BUCKET"]}]}
        EOF
        exec weed server -dir=/data -master.volumeSizeLimitMB=512 -volume.max=0 -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - pharmacy-central-seaweedfs-data:/data
    ports:
      - "${SEAWEEDFS_S3_PORT}:9000"

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      SEAWEEDFS_MEDIA_BUCKET: ${SEAWEEDFS_MEDIA_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if echo s3.bucket.list | weed shell -master=seaweedfs:9333 | grep -q "^[[:space:]]*$$SEAWEEDFS_MEDIA_BUCKET[[:space:]]"; then
          echo "bucket $$SEAWEEDFS_MEDIA_BUCKET already exists"
        else
          echo "s3.bucket.create -name $$SEAWEEDFS_MEDIA_BUCKET" | weed shell -master=seaweedfs:9333
        fi
    restart: "no"

  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    volumes:
      - ./deploy/local/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/local/gateway/routes.conf:/etc/nginx/pharmacy-routes.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${GATEWAY_PORT}:8080"

  # Same routes as `gateway`, but forwarding to services that `pnpm dev` runs on the host.
  # Only started when named (`pnpm run infra:up`); it shares GATEWAY_PORT with `gateway`, so run one of them.
  #
  # It shares the host network instead of publishing a port, and proxies to the host's own loopback.
  # A container on the compose bridge cannot reach host services: ufw denies new connections on INPUT
  # and only manages DOCKER-USER (forwarded) traffic, so `host.docker.internal` upstreams hang and
  # every route answers 504. `network_mode: host` avoids that hop entirely, and GATEWAY_PORT is then
  # bound by this container's nginx (hence no `ports:` and no `extra_hosts:`).
  gateway-dev:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    profiles: ["dev"]
    restart: unless-stopped
    network_mode: host
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      IDENTITY_PORT: ${IDENTITY_PORT}
      CATALOG_PORT: ${CATALOG_PORT}
      INVENTORY_PORT: ${INVENTORY_PORT}
      SALES_PORT: ${SALES_PORT}
      PAYMENT_PORT: ${PAYMENT_PORT}
      OPERATIONS_QUERY_PORT: ${OPERATIONS_QUERY_PORT}
    volumes:
      - ./deploy/local/gateway/nginx.dev.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/local/gateway/routes.conf:/etc/nginx/pharmacy-routes.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${GATEWAY_PORT}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  identity-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/identity-service"
        APP_DIR: apps/identity-service
    environment:
      <<: *backend-environment
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/identity_service
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB}
      ARGON2_PASSES: ${ARGON2_PASSES}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM}
    ports:
      - "${IDENTITY_PORT}:3001"

  catalog-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/catalog-service"
        APP_DIR: apps/catalog-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog_service
      SEAWEEDFS_ENDPOINT: http://seaweedfs:9000
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      SEAWEEDFS_MEDIA_BUCKET: ${SEAWEEDFS_MEDIA_BUCKET}
      SEAWEEDFS_PUBLIC_MEDIA_URL: ${SEAWEEDFS_PUBLIC_MEDIA_URL}
    ports:
      - "${CATALOG_PORT}:3002"

  inventory-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/inventory-service"
        APP_DIR: apps/inventory-service
    environment:
      <<: *backend-environment
      PORT: 3004
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/inventory_service
      CATALOG_SERVICE_URL: http://catalog-service:3002
    ports:
      - "${INVENTORY_PORT}:3004"

  sales-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/sales-service"
        APP_DIR: apps/sales-service
    environment:
      <<: *backend-environment
      PORT: 3005
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sales_service
      CATALOG_SERVICE_URL: http://catalog-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      IDENTITY_SERVICE_URL: http://identity-service:3001
      OPENROUTESERVICE_BASE_URL: ${OPENROUTESERVICE_BASE_URL}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY}
      DELIVERY_FREE_DISTANCE_METERS: ${DELIVERY_FREE_DISTANCE_METERS}
      DELIVERY_FEE_BASE: ${DELIVERY_FEE_BASE}
      DELIVERY_FEE_PER_KILOMETER: ${DELIVERY_FEE_PER_KILOMETER}
      DELIVERY_MAX_DISTANCE_METERS: ${DELIVERY_MAX_DISTANCE_METERS}
      VIETMAP_API_KEY: ${VIETMAP_API_KEY}
      VIETMAP_BASE_URL: ${VIETMAP_BASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL}
      GEMINI_MODEL: ${GEMINI_MODEL}
    ports:
      - "${SALES_PORT}:3005"

  payment-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/payment-service"
        APP_DIR: apps/payment-service
    environment:
      <<: *backend-environment
      PORT: 3006
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment_service
      CATALOG_SERVICE_URL: http://catalog-service:3002
      SALES_SERVICE_URL: http://sales-service:3005
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET}
      PHARMACY_PAYMENT_SEPAY_BANK: ${PHARMACY_PAYMENT_SEPAY_BANK}
      PHARMACY_PAYMENT_SEPAY_ACCOUNT_NUMBER: ${PHARMACY_PAYMENT_SEPAY_ACCOUNT_NUMBER}
      PHARMACY_PAYMENT_SEPAY_QR_BASE_URL: ${PHARMACY_PAYMENT_SEPAY_QR_BASE_URL}
    ports:
      - "${PAYMENT_PORT}:3006"

  operations-query-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/operations-query-service"
        APP_DIR: apps/operations-query-service
    environment:
      <<: *backend-environment
      PORT: 3007
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/operations_query_service
      CATALOG_SERVICE_URL: http://catalog-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      SALES_SERVICE_URL: http://sales-service:3005
    ports:
      - "${OPERATIONS_QUERY_PORT}:3007"

  customer-web:
    build:
      context: .
      dockerfile: apps/Dockerfile.web
      args:
        APP_NAME: "@pharmacy/customer-web"
        APP_DIR: apps/customer-web
        # Vite inlines this at build time, so the image is the only place it can come from.
        VITE_VIETMAP_TILEMAP_KEY: ${VITE_VIETMAP_TILEMAP_KEY}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${CUSTOMER_WEB_PORT}:8080"

  staff-web:
    build:
      context: .
      dockerfile: apps/Dockerfile.web
      args:
        APP_NAME: "@pharmacy/staff-web"
        APP_DIR: apps/staff-web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${STAFF_WEB_PORT}:8080"

volumes:
  pharmacy-central-postgres-data:
  pharmacy-central-valkey-data:
  pharmacy-central-seaweedfs-data:

name: pharmacy-central

x-backend-defaults: &backend-defaults
  restart: unless-stopped
  depends_on:
    postgres-roles:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
    otel-collector:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD-SHELL",
        'node -e "fetch(''http://127.0.0.1:'' + process.env.PORT + ''/health/ready'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
      ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s

x-backend-environment: &backend-environment
  NODE_ENV: development
  DATABASE_USER: ${POSTGRES_USER}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  REDIS_URL: redis://redis:6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}

services:
  postgres:
    image: &postgres-image postgis/postgis:18-3.6@sha256:db8c151a4e1f4686b1a985a3490cf96f9f8c8c2725f58a46ef7a57e52f167cc3
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity_service
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - pharmacy-central-postgres-data:/var/lib/postgresql
      - ./deploy/local/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"

  postgres-roles:
    image: *postgres-image
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      SALES_DB_PASSWORD: ${SALES_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      OPERATIONS_QUERY_DB_PASSWORD: ${OPERATIONS_QUERY_DB_PASSWORD}
      CHATBOT_DB_PASSWORD: ${CHATBOT_DB_PASSWORD}
    volumes:
      - ./deploy/local/postgres/roles.sh:/roles.sh:ro
    entrypoint: ["sh", "/roles.sh"]

  rabbitmq:
    image: rabbitmq:4.3.5-management@sha256:397fde82bc04522d88680b57cbf5d70caae715a76c957404e52e3f0fa056b8f3
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - pharmacy-central-redis-data:/data
    ports:
      - "${REDIS_PORT}:6379"

  typesense:
    # 30.2 segfaults at start (exit 139) on Docker Desktop with WSL2, whose kernel has no /proc/self/io; 31.0 starts.
    image: typesense/typesense:31.0.rc23@sha256:1a4d13c3ba1a11b6b0308795419aac135dfc8152637463d291eb3536bd4ae415
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q '"ok":true' <&3
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - pharmacy-central-typesense-data:/data
    ports:
      - "${TYPESENSE_PORT}:8108"

  # Self-hosted text embeddings for the product search, so it needs no quota (see docs/runbook.md). The model
  # downloads on first start. catalog-service and search-service reach it at http://embedder:80/v1; services under
  # pnpm dev use http://localhost:${EMBEDDER_PORT}/v1 from .env.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: unless-stopped
    command:
      - --model-id
      - ${EMBEDDER_MODEL}
      - --api-key
      - ${EMBEDDER_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    volumes:
      - pharmacy-central-embedder-data:/data
    ports:
      - "${EMBEDDER_PORT}:80"

  mailpit:
    image: axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_HTTP_PORT}:8025"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/collector.yaml"]
    volumes:
      - ./deploy/local/otel/collector.yaml:/etc/otelcol-contrib/collector.yaml:ro
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/collector.yaml"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "4317:4317"
      - "4318:4318"

  # Local observability backends. The collector fans telemetry out to them; only Grafana publishes a host port.
  # The tempo and loki images are distroless (no shell, wget or health command), so they have no healthcheck.
  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # The image runs as 10001:10001; the named volume inherits that ownership from the image on first creation.
    volumes:
      - ./deploy/local/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - pharmacy-central-tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./deploy/local/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pharmacy-central-prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/local/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - pharmacy-central-loki-data:/loki

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    restart: unless-stopped
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/start-here.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./deploy/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - pharmacy-central-grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"

  # Floci is the local AWS emulator (S3 for product media, ECR for image push tests). The Docker socket lets it start
  # the backing ECR registry container; its web console sidecar is off.
  floci:
    image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
    restart: unless-stopped
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: ${AWS_REGION}
      FLOCI_STORAGE_MODE: persistent
      FLOCI_SERVICES_UI_ENABLED: "false"
      # Docker 29 defaults to the containerd image store, which reaches only localhost over plain HTTP.
      FLOCI_SERVICES_ECR_URI_STYLE: path
    volumes:
      - pharmacy-central-floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${FLOCI_PORT}:4566"

  floci-init:
    image: amazon/aws-cli:2.39.0@sha256:6014c77975a4ae237395924cc821333f20bf87c91964a45dd4ed5f3b13b424f5
    depends_on:
      floci:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL_S3: http://floci:4566
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MEDIA_BUCKET: ${MEDIA_BUCKET}
    # Writes need the key pair; anonymous visitors may only read the media bucket (public product images).
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if aws s3api head-bucket --bucket "$$MEDIA_BUCKET" 2>/dev/null; then
          echo "bucket $$MEDIA_BUCKET already exists"
        else
          aws s3api create-bucket --bucket "$$MEDIA_BUCKET"
        fi
        aws s3api put-bucket-policy --bucket "$$MEDIA_BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::$$MEDIA_BUCKET/*\"}]}"
    restart: "no"

  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
      search-service:
        condition: service_healthy
    volumes:
      - ./deploy/local/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/local/gateway/routes.conf:/etc/nginx/pharmacy-routes.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${GATEWAY_PORT}:8080"

  # Same routes as `gateway`, but forwarding to services that `pnpm dev` runs on the host.
  # Only started when named (`pnpm run dev:infra`); it shares GATEWAY_PORT with `gateway`, so run one of them.
  #
  # It shares the host network instead of publishing a port, and proxies to the host's own loopback.
  # A container on the compose bridge cannot reach host services: ufw denies new connections on INPUT
  # and only manages DOCKER-USER (forwarded) traffic, so `host.docker.internal` upstreams hang and
  # every route answers 504. `network_mode: host` avoids that hop entirely, and GATEWAY_PORT is then
  # bound by this container's nginx (hence no `ports:` and no `extra_hosts:`).
  gateway-dev:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    profiles: ["dev"]
    restart: unless-stopped
    network_mode: host
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      IDENTITY_PORT: ${IDENTITY_PORT}
      CATALOG_PORT: ${CATALOG_PORT}
      SEARCH_PORT: ${SEARCH_PORT}
      INVENTORY_PORT: ${INVENTORY_PORT}
      SALES_PORT: ${SALES_PORT}
      CHATBOT_PORT: ${CHATBOT_PORT}
      OPS_CONSOLE_PORT: ${OPS_CONSOLE_PORT}
      PAYMENT_PORT: ${PAYMENT_PORT}
      OPERATIONS_QUERY_PORT: ${OPERATIONS_QUERY_PORT}
    volumes:
      - ./deploy/local/gateway/nginx.dev.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/local/gateway/routes.conf:/etc/nginx/pharmacy-routes.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${GATEWAY_PORT}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  identity-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/identity-service"
        APP_DIR: apps/identity-service
        BUILD_VERSION: ${BUILD_VERSION}
    environment:
      <<: *backend-environment
      PORT: 3001
      ACCESS_TOKEN_PRIVATE_KEY: ${ACCESS_TOKEN_PRIVATE_KEY}
      ACCESS_TOKEN_PUBLIC_JWK: ${ACCESS_TOKEN_PUBLIC_JWK}
      ACCESS_TOKEN_KEY_ID: ${ACCESS_TOKEN_KEY_ID}
      DATABASE_URL: postgres://identity_service:${IDENTITY_DB_PASSWORD}@postgres:5432/identity_service
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB}
      ARGON2_PASSES: ${ARGON2_PASSES}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM}
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS}
    ports:
      - "${IDENTITY_PORT}:3001"

  catalog-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/catalog-service"
        APP_DIR: apps/catalog-service
        BUILD_VERSION: ${BUILD_VERSION}
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      floci-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      PORT: 3002
      IDENTITY_JWKS_URL: http://identity-service:3001/.well-known/jwks.json
      DATABASE_URL: postgres://catalog_service:${CATALOG_DB_PASSWORD}@postgres:5432/catalog_service
      AWS_ENDPOINT_URL_S3: http://floci:4566
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL}
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER}
      AI_EMBEDDING_BASE_URL: http://embedder:80/v1
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY}
    ports:
      - "${CATALOG_PORT}:3002"

  # Product list (GET /api/products) only: the gateway sends that GET here and every other /api/products request to
  # catalog-service. Reads Typesense and falls back to catalog-service when Typesense or the embedder cannot answer.
  # The image is built from apps/search-service/Dockerfile; its runtime must ship busybox wget for the healthcheck.
  search-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/search-service/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION}
    depends_on:
      typesense:
        condition: service_healthy
      embedder:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      <<: *backend-environment
      PORT: 3009
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      CATALOG_SERVICE_URL: http://catalog-service:3002
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER}
      AI_EMBEDDING_BASE_URL: http://embedder:80/v1
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY}
    ports:
      - "${SEARCH_PORT}:3009"

  inventory-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/inventory-service"
        APP_DIR: apps/inventory-service
        BUILD_VERSION: ${BUILD_VERSION}
    environment:
      <<: *backend-environment
      PORT: 3004
      IDENTITY_JWKS_URL: http://identity-service:3001/.well-known/jwks.json
      DATABASE_URL: postgres://inventory_service:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory_service
      CATALOG_SERVICE_URL: http://catalog-service:3002
      IDENTITY_SERVICE_URL: http://identity-service:3001
    ports:
      - "${INVENTORY_PORT}:3004"

  sales-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/sales-service"
        APP_DIR: apps/sales-service
        BUILD_VERSION: ${BUILD_VERSION}
    environment:
      <<: *backend-environment
      PORT: 3005
      IDENTITY_JWKS_URL: http://identity-service:3001/.well-known/jwks.json
      DATABASE_URL: postgres://sales_service:${SALES_DB_PASSWORD}@postgres:5432/sales_service
      CATALOG_SERVICE_URL: http://catalog-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      IDENTITY_SERVICE_URL: http://identity-service:3001
      OPENROUTESERVICE_BASE_URL: ${OPENROUTESERVICE_BASE_URL}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY}
      DELIVERY_FREE_DISTANCE_METERS: ${DELIVERY_FREE_DISTANCE_METERS}
      DELIVERY_FEE_BASE: ${DELIVERY_FEE_BASE}
      DELIVERY_FEE_PER_KILOMETER: ${DELIVERY_FEE_PER_KILOMETER}
      DELIVERY_MAX_DISTANCE_METERS: ${DELIVERY_MAX_DISTANCE_METERS}
      VIETMAP_API_KEY: ${VIETMAP_API_KEY}
      VIETMAP_BASE_URL: ${VIETMAP_BASE_URL}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      AI_PRESCRIPTION_READER_PROVIDER: ${AI_PRESCRIPTION_READER_PROVIDER}
      AI_PRESCRIPTION_READER_BASE_URL: ${AI_PRESCRIPTION_READER_BASE_URL}
      AI_PRESCRIPTION_READER_MODEL: ${AI_PRESCRIPTION_READER_MODEL}
      AI_PRESCRIPTION_READER_API_KEY: ${AI_PRESCRIPTION_READER_API_KEY}
    ports:
      - "${SALES_PORT}:3005"

  chatbot-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/chatbot-service"
        APP_DIR: apps/chatbot-service
        BUILD_VERSION: ${BUILD_VERSION}
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
      catalog-service:
        condition: service_healthy
    environment:
      PORT: 3008
      IDENTITY_JWKS_URL: http://identity-service:3001/.well-known/jwks.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CATALOG_SERVICE_URL: http://catalog-service:3002
      DATABASE_URL: postgres://chatbot_service:${CHATBOT_DB_PASSWORD}@postgres:5432/chatbot_service
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      AI_CHATBOT_PROVIDER: ${AI_CHATBOT_PROVIDER}
      AI_CHATBOT_BASE_URL: ${AI_CHATBOT_BASE_URL}
      AI_CHATBOT_MODEL: ${AI_CHATBOT_MODEL}
      AI_CHATBOT_API_KEY: ${AI_CHATBOT_API_KEY}
      AI_INTENT_GATE_PROVIDER: ${AI_INTENT_GATE_PROVIDER}
      AI_INTENT_GATE_BASE_URL: ${AI_INTENT_GATE_BASE_URL}
      AI_INTENT_GATE_MODEL: ${AI_INTENT_GATE_MODEL}
      AI_INTENT_GATE_API_KEY: ${AI_INTENT_GATE_API_KEY}
    ports:
      - "${CHATBOT_PORT}:3008"

  ops-console-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/ops-console-service"
        APP_DIR: apps/ops-console-service
        BUILD_VERSION: ${BUILD_VERSION}
    depends_on:
      prometheus:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      PORT: 3010
      IDENTITY_JWKS_URL: http://identity-service:3001/.well-known/jwks.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      IDENTITY_SERVICE_URL: http://identity-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      SEARCH_SERVICE_URL: http://search-service:3009
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      SALES_SERVICE_URL: http://sales-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3006
      OPERATIONS_QUERY_SERVICE_URL: http://operations-query-service:3007
      CHATBOT_SERVICE_URL: http://chatbot-service:3008
      PROMETHEUS_URL: http://prometheus:9090
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_MANAGEMENT_USER: ${RABBITMQ_USER}
      RABBITMQ_MANAGEMENT_PASSWORD: ${RABBITMQ_PASSWORD}
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL}
    ports:
      - "${OPS_CONSOLE_PORT}:3010"

  payment-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/payment-service"
        APP_DIR: apps/payment-service
        BUILD_VERSION: ${BUILD_VERSION}
    environment:
      <<: *backend-environment
      PORT: 3006
      IDENTITY_JWKS_URL: http://identity-service:3001/.well-known/jwks.json
      DATABASE_URL: postgres://payment_service:${PAYMENT_DB_PASSWORD}@postgres:5432/payment_service
      CATALOG_SERVICE_URL: http://catalog-service:3002
      SALES_SERVICE_URL: http://sales-service:3005
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET}
      PHARMACY_PAYMENT_SEPAY_BANK: ${PHARMACY_PAYMENT_SEPAY_BANK}
      PHARMACY_PAYMENT_SEPAY_ACCOUNT_NUMBER: ${PHARMACY_PAYMENT_SEPAY_ACCOUNT_NUMBER}
      PHARMACY_PAYMENT_SEPAY_QR_BASE_URL: ${PHARMACY_PAYMENT_SEPAY_QR_BASE_URL}
    ports:
      - "${PAYMENT_PORT}:3006"

  operations-query-service:
    <<: *backend-defaults
    build:
      context: .
      dockerfile: apps/Dockerfile.service
      args:
        APP_NAME: "@pharmacy/operations-query-service"
        APP_DIR: apps/operations-query-service
        BUILD_VERSION: ${BUILD_VERSION}
    environment:
      <<: *backend-environment
      PORT: 3007
      IDENTITY_JWKS_URL: http://identity-service:3001/.well-known/jwks.json
      DATABASE_URL: postgres://operations_query_service:${OPERATIONS_QUERY_DB_PASSWORD}@postgres:5432/operations_query_service
      CATALOG_SERVICE_URL: http://catalog-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      SALES_SERVICE_URL: http://sales-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3006
    ports:
      - "${OPERATIONS_QUERY_PORT}:3007"

  customer-web:
    build:
      context: .
      dockerfile: apps/Dockerfile.web
      args:
        APP_NAME: "@pharmacy/customer-web"
        APP_DIR: apps/customer-web
        # Vite inlines this at build time, so the image is the only place it can come from.
        VITE_VIETMAP_TILEMAP_KEY: ${VITE_VIETMAP_TILEMAP_KEY}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${CUSTOMER_WEB_PORT}:8080"

  staff-web:
    build:
      context: .
      dockerfile: apps/Dockerfile.web
      args:
        APP_NAME: "@pharmacy/staff-web"
        APP_DIR: apps/staff-web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${STAFF_WEB_PORT}:8080"

  # Load runs (`pnpm run load -- <script>`). The profile keeps it out of `up`: it exists to be run on demand.
  # It sits on the compose network to write results to Prometheus, and reaches the gateway at LOAD_TARGET_URL:
  # http://host.docker.internal:${GATEWAY_PORT} against `pnpm dev`, http://gateway:8080 against `pnpm run local:up`, or at the public URL of the cloud stack.
  k6:
    image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
    profiles: ["loadtest"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOAD_TARGET_URL: ${LOAD_TARGET_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),avg,max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    volumes:
      - ./tools/k6:/scripts:ro
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  pharmacy-central-postgres-data:
  pharmacy-central-redis-data:
  pharmacy-central-typesense-data:
  pharmacy-central-embedder-data:
  pharmacy-central-floci-data:
  pharmacy-central-tempo-data:
  pharmacy-central-prometheus-data:
  pharmacy-central-loki-data:
  pharmacy-central-grafana-data:

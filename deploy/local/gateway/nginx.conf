# Local-only API gateway. Stands in for the AWS ALB path rules.
# Not used in production. Browsers and Vite dev proxy send /api/... here.
resolver 127.0.0.11 valid=30s;

server {
    listen 8080;
    server_name localhost;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    set $identity http://identity-service:3001;
    set $catalog http://catalog-service:3002;
    set $inventory http://inventory-service:3004;
    set $sales http://sales-service:3005;
    set $payment http://payment-service:3006;
    set $query http://operations-query-service:3007;

    location ~ ^/api/(auth|admin)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $identity;
    }

    location ~ ^/api/(sites|storage-locations|products|suppliers|pricing|stores|availability)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $catalog;
    }

    location ~ ^/api/(procurement|inventory|quality)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $inventory;
    }

    location ~ ^/api/(carts|orders|delivery|prescriptions|counter-transactions)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $sales;
    }

    location ~ ^/api/(payments)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $payment;
    }

    location ~ ^/api/(operations|dashboard|finance|audit|reports)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $query;
    }

    location / {
        default_type application/json;
        return 404 '{"title":"Not Found","status":404}';
    }
}

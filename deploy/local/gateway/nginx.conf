# Local-only API gateway. Stands in for the AWS ALB path rules.
# This one forwards to the Compose app containers; nginx.dev.conf.template forwards to `pnpm dev` on the host.
resolver 127.0.0.11 valid=30s;

map $request_method $products_upstream {
    GET $search;
    default $catalog;
}

server {
    listen 8080;
    server_name localhost;

    set $identity http://identity-service:3001;
    set $catalog http://catalog-service:3002;
    set $search http://search-service:3009;
    set $inventory http://inventory-service:3004;
    set $sales http://sales-service:3005;
    set $payment http://payment-service:3006;
    set $query http://operations-query-service:3007;
    set $chatbot http://chatbot-service:3008;
    set $ops http://ops-console-service:3010;

    # Any proxy_set_header here replaces nginx's defaults for every location below, so Host and Connection are restated.
    # X-Forwarded-For is overwritten with the address this gateway saw, so a client cannot supply its own.
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection close;
    proxy_set_header X-Forwarded-For $remote_addr;

    include /etc/nginx/pharmacy-routes.conf;
}

# Path rules shared by both local gateways (nginx.conf for the Compose app containers,
# nginx.dev.conf.template for services running in dev mode on the host). Each including
# server block sets $identity, $catalog, $search, $inventory, $sales, $payment, $query, $chatbot, and $ops.
# Each gateway's http block also maps $products_upstream from $request_method: GET to $search, the rest to $catalog.

location = /healthz {
    access_log off;
    return 200 'ok';
}

location ~ ^/api/(auth|admin|customers)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $identity;
}

# GET /api/products (exact match, so it wins over the catalog regex below) is served by search-service. POST and the
# /api/products/... paths keep going to catalog-service.
location = /api/products {
    client_max_body_size 25m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $products_upstream;
}

location ~ ^/api/(sites|storage-locations|products|suppliers|pricing|stores|availability)(/|$) {
    client_max_body_size 25m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $catalog;
}

location ~ ^/api/(procurement|inventory|quality)(/|$) {
    client_max_body_size 25m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $inventory;
}

# Prescription photo intake: above sales-service's 8 MB image limit, so oversized photos get its JSON 413.
location ~ ^/api/prescriptions/intake(/|$) {
    client_max_body_size 10m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $sales;
}

location ~ ^/api/(carts|orders|delivery|prescriptions|counter-transactions)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $sales;
}

location ~ ^/api/(payments)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $payment;
}

location ~ ^/api/(operations|dashboard|finance|audit|reports)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $query;
}

location ~ ^/api/(chatbot)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $chatbot;
}

location ~ ^/api/(system)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $ops;
}

location / {
    default_type application/json;
    return 404 '{"title":"Not Found","status":404}';
}

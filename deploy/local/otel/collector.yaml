receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Queue depth and consumer counts from the RabbitMQ management API (queue metrics are per queue, resource attribute rabbitmq.queue.name).
  rabbitmq:
    endpoint: http://rabbitmq:15672
    username: ${env:RABBITMQ_USER}
    password: ${env:RABBITMQ_PASSWORD}
    collection_interval: 30s
    metrics:
      rabbitmq.message.current:
        enabled: true

processors:
  batch: {}
  # Prometheus only promotes listed resource attributes, so copy the queue name onto each datapoint (label rabbitmq_queue_name).
  transform/rabbitmq_queue:
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.attributes["rabbitmq.queue.name"], resource.attributes["rabbitmq.queue.name"]) where resource.attributes["rabbitmq.queue.name"] != nil

exporters:
  debug:
    verbosity: basic
  otlp_http/tempo:
    endpoint: http://tempo:4318
  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

connectors:
  # Emits traces_spanmetrics_calls_total and traces_spanmetrics_duration_seconds_* (labels: service_name, span_name, span_kind, status_code).
  span_metrics:
    namespace: traces.spanmetrics
    histogram:
      unit: s
    # Single collector instance: drop the per-start random instance id to keep series stable across restarts.
    exclude_dimensions: ["collector.instance.id"]
  # Emits traces_service_graph_request_total, traces_service_graph_request_failed_total and traces_service_graph_request_{server,client}_seconds_*.
  service_graph: {}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/tempo, span_metrics, service_graph]
    metrics:
      receivers: [otlp, rabbitmq, span_metrics, service_graph]
      processors: [transform/rabbitmq_queue, batch]
      exporters: [debug, otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/loki]

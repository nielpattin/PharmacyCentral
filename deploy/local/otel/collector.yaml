receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic
  otlp_http/tempo:
    endpoint: http://tempo:4318
  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/loki]

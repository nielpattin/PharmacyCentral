global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  promote_resource_attributes:
    - service.name
    - service.instance.id
    - host.name
    - service.namespace
    - deployment.environment
  translation_strategy: UnderscoreEscapingWithSuffixes

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

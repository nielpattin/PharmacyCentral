name: Node workspace validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - rewrite/express-microservices

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 12.3.4

jobs:
  validate:
    name: Validate affected workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Verify runtime
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.ref_name }}-
            nx-${{ runner.os }}-
      - name: Check formatting
        run: pnpm run fmt:check
      - name: Check TypeScript project references
        run: pnpm run sync:check
      - name: Compute affected range
        id: shas
        shell: bash
        run: |
          git fetch origin main --depth=1
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "head=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Run affected lint, typecheck, tests, and builds
        run: >-
          pnpm exec nx affected
          -t lint,typecheck,test,build
          --base=${{ steps.shas.outputs.base }}
          --head=${{ steps.shas.outputs.head }}
          --parallel=3
          --outputStyle=static
      - name: Validate Compose configuration
        run: docker compose config --quiet

  affected-images:
    name: Find affected deployable images
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve affected images
        id: projects
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const projects = JSON.parse(execFileSync('pnpm', ['exec', 'nx', 'show', 'projects', '--affected', `--base=${process.env.BASE_SHA}`, `--head=${process.env.HEAD_SHA}`, '--json'], { encoding: 'utf8' }));
          const deployables = new Map([
            ['identity-service', ['identity-service', '@pharmacy/identity-service', 'Dockerfile.service']],
            ['catalog-service', ['catalog-service', '@pharmacy/catalog-service', 'Dockerfile.service']],
            ['inventory-service', ['inventory-service', '@pharmacy/inventory-service', 'Dockerfile.service']],
            ['sales-service', ['sales-service', '@pharmacy/sales-service', 'Dockerfile.service']],
            ['payment-service', ['payment-service', '@pharmacy/payment-service', 'Dockerfile.service']],
            ['operations-query-service', ['operations-query-service', '@pharmacy/operations-query-service', 'Dockerfile.service']],
            ['customer-web', ['customer-web', '@pharmacy/customer-web', 'Dockerfile.web']],
            ['staff-web', ['staff-web', '@pharmacy/staff-web', 'Dockerfile.web']],
          ]);
          const include = projects.flatMap((project) => {
            const item = deployables.get(project);
            return item ? [{ name: item[0], app: item[1], dockerfile: item[2] }] : [];
          });
          const matrix = JSON.stringify({ include });
          const fs = require('node:fs');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${matrix}\n`);
          NODE

  publish-images:
    name: Build and publish immutable application image
    runs-on: ubuntu-latest
    needs: affected-images
    if: needs.affected-images.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected-images.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.dockerfile }}
          build-args: |
            APP_NAME=${{ matrix.app }}
            APP_DIR=apps/${{ matrix.name }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pharmacy-central/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Write digest
        run: echo "${{ matrix.name }}@${{ steps.image.outputs.digest }}" > image-digest.txt
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.name }}
          path: image-digest.txt

  image-digests:
    name: Check immutable infrastructure references
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check pinned images
        shell: bash
        run: |
          test "$(grep -c '@sha256:' docker-compose.yml)" -ge 8
          if grep -R 'image:.*:latest' deploy docker-compose.yml; then
            echo 'Floating latest image tags are not allowed'
            exit 1
          fi

name: Release application images

# A version tag (v1.4.0) builds every image on GitHub and pushes it to ECR under that same tag. ECR tags are immutable,
# so a version is released once; the next change is the next version. Deploying a version is a separate step
# (terraform apply -var image_tag=v1.4.0).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 12.3.4
  ECR_PREFIX: pharmacy-central-staging

concurrency:
  group: release-application-images
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Verify runtime
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run fmt:check
      - name: Check TypeScript project references
        run: pnpm run sync:check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build

  publish-images:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: identity-service, dockerfile: apps/Dockerfile.service }
          - { name: catalog-service, dockerfile: apps/Dockerfile.service }
          - { name: inventory-service, dockerfile: apps/Dockerfile.service }
          - { name: sales-service, dockerfile: apps/Dockerfile.service }
          - { name: payment-service, dockerfile: apps/Dockerfile.service }
          - { name: operations-query-service, dockerfile: apps/Dockerfile.service }
          - { name: chatbot-service, dockerfile: apps/Dockerfile.service }
          - { name: ops-console-service, dockerfile: apps/Dockerfile.service }
          - { name: search-service, dockerfile: apps/search-service/Dockerfile }
          - { name: customer-web, dockerfile: apps/Dockerfile.web }
          - { name: staff-web, dockerfile: apps/Dockerfile.web }
          - { name: ops, dockerfile: deploy/aws/ops/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: |
            APP_NAME=@pharmacy/${{ matrix.name }}
            APP_DIR=apps/${{ matrix.name }}
            BUILD_VERSION=${{ github.ref_name }}
            VITE_VIETMAP_TILEMAP_KEY=${{ secrets.VITE_VIETMAP_TILEMAP_KEY }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}-${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Summary
        run: echo "${{ matrix.name }} ${{ github.ref_name }} ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  image-digests:
    name: Check immutable infrastructure references
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check pinned images
        shell: bash
        run: |
          test "$(grep -c '@sha256:' docker-compose.yml)" -ge 8
          if grep -R 'image:.*:latest' deploy docker-compose.yml; then
            echo 'Floating latest image tags are not allowed'
            exit 1
          fi

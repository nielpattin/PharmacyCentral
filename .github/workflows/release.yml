name: Release application images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in MAJOR.MINOR.PATCH form, for example 1.4.0
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 12.3.4
  REGISTRY: ghcr.io

concurrency:
  group: release-application-images
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must use MAJOR.MINOR.PATCH form, for example 1.4.0"
            exit 1
          fi
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists. Choose a new version."
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Verify runtime
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run fmt:check
      - name: Check TypeScript project references
        run: pnpm run sync:check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build

  publish-images:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-service
            app: "@pharmacy/identity-service"
            dockerfile: Dockerfile.service
          - name: catalog-service
            app: "@pharmacy/catalog-service"
            dockerfile: Dockerfile.service
          - name: inventory-service
            app: "@pharmacy/inventory-service"
            dockerfile: Dockerfile.service
          - name: sales-service
            app: "@pharmacy/sales-service"
            dockerfile: Dockerfile.service
          - name: payment-service
            app: "@pharmacy/payment-service"
            dockerfile: Dockerfile.service
          - name: operations-query-service
            app: "@pharmacy/operations-query-service"
            dockerfile: Dockerfile.service
          - name: ops-console-service
            app: "@pharmacy/ops-console-service"
            dockerfile: Dockerfile.service
          - name: search-service
            app: "@pharmacy/search-service"
            dockerfile: search-service/Dockerfile
          - name: customer-web
            app: "@pharmacy/customer-web"
            dockerfile: Dockerfile.web
          - name: staff-web
            app: "@pharmacy/staff-web"
            dockerfile: Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.dockerfile }}
          build-args: |
            APP_NAME=${{ matrix.app }}
            APP_DIR=apps/${{ matrix.name }}
            BUILD_VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/pharmacy-central/${{ matrix.name }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/pharmacy-central/${{ matrix.name }}:v${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Write digest
        run: echo "${{ matrix.name }}@${{ steps.image.outputs.digest }}" > image-digest.txt
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.name }}
          path: image-digest.txt

  image-digests:
    name: Check immutable infrastructure references
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check pinned images
        shell: bash
        run: |
          test "$(grep -c '@sha256:' docker-compose.yml)" -ge 8
          if grep -R 'image:.*:latest' deploy docker-compose.yml; then
            echo 'Floating latest image tags are not allowed'
            exit 1
          fi

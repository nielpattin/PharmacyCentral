# Sizes the container stack like deploy/aws, one container per ECS service, as `terraform.tfvars` runs it
# (`desired_count = 1`, autoscaling off). Layer it over the main file:
#
#   pnpm run aws
#
# Limits mirror the Fargate task sizes and the managed data tier of deploy/aws:
# - Backend services: `task_cpu` 512 / `task_memory` 2048 (0.5 vCPU, 2 GiB). sales-service has no override.
# - customer-web, staff-web: `web_task_cpu` 256 / `web_task_memory` 512 (0.25 vCPU, 512 MiB).
# - RabbitMQ and Typesense are Fargate tasks of 256 / 512 in data.tf.
# - The embedder is a Fargate task of 2048 / 4096 (`embedder_task_cpu`, `embedder_task_memory`).
# - PostgreSQL is RDS `db.t4g.micro` (2 vCPU, 1 GiB) and Redis is ElastiCache `cache.t4g.micro` (2 vCPU, 0.5 GiB).
# Fargate vCPUs are CPU quota, like the Docker limits below, so the numbers are comparable but not identical to AWS.
x-backend-task: &backend-task
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 2g

x-web-task: &web-task
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 512m

x-data-task: &data-task
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 512m

services:
  identity-service: *backend-task
  catalog-service: *backend-task
  search-service: *backend-task
  inventory-service: *backend-task
  sales-service: *backend-task
  payment-service: *backend-task
  operations-query-service: *backend-task
  chatbot-service: *backend-task
  ops-console-service: *backend-task

  customer-web: *web-task
  staff-web: *web-task

  rabbitmq: *data-task
  typesense: *data-task
  embedder:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

  postgres:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
  redis:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512m
